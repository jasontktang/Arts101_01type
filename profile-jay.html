<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jay - ARTS101 Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #B4182D; color: #ffffff; overflow-x: hidden; line-height: 1.5; }

    header { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; z-index: 100; background: rgba(180, 24, 45, 0.95); backdrop-filter: blur(8px); }
    .brand-logo { font-size: 26px; font-weight: 900; letter-spacing: 1.5px; text-decoration: none; text-transform: uppercase; color: #ffffff; }
    .insta-link { display: flex; align-items: center; gap: 8px; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 14px; text-transform: uppercase; background: rgba(0, 0, 0, 0.3); padding: 8px 16px; border-radius: 20px; transition: all 0.3s ease; }
    .insta-link:hover { background: #ffffff; color: #B4182D; }

    .profile-hero { height: 350px; background-position: center; background-size: cover; background-repeat: no-repeat; margin-top: 70px; }
    .profile-content { max-width: 1000px; margin: -80px auto 60px; padding: 0 30px; text-align: center; }
    .avatar { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 5px solid #B4182D; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
    .profile-content h1 { font-size: 42px; margin-top: 15px; text-transform: uppercase; font-weight: 900; }
    .role { font-size: 18px; opacity: 0.9; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 1px; }

    .gallery-title { font-size: 28px; text-transform: uppercase; border-bottom: 3px solid #ffffff; padding-bottom: 8px; margin-bottom: 30px; text-align: left; font-weight: 900; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .gallery-grid img { width: 100%; height: 240px; object-fit: cover; border-radius: 12px; transition: transform 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .gallery-grid img:hover { transform: scale(1.04); }

    footer { text-align: center; padding: 40px; background: rgba(0, 0, 0, 0.3); opacity: 0.8; font-size: 14px; margin-top: 60px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-logo">Arts_101</a>
    <a href="https://www.instagram.com/arts101hk?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="insta-link">
      <i class="fa-brands fa-instagram"></i> click me!
    </a>
  </header>

  <div class="profile-hero" style="background-image: linear-gradient(rgba(180, 24, 45, 0.4), #B4182D), url('Jay1_arts101.jpg');"></div>

  <div class="profile-content">
    <img src="Jay_profile.jpg" alt="Jay Profile" class="avatar">
    <h1>Jay</h1>
    <p class="role">Founder of ARTS101</p>

    <div class="gallery-title">Artworks</div>
    <div class="gallery-grid">
      <img src="Jay1_arts101.jpg" alt="Jay Artwork 1">
      <img src="Jay2_arts101.jpg" alt="Jay Artwork 2">
      <img src="Jay3_arts101.jpg" alt="Jay Artwork 3">
      <img src="Jay4_arts101.jpg" alt="Jay Artwork 4">
      <img src="picture_red03.jpg" alt="Jay Artwork 5">
    </div>
  </div>

  <footer>
    <p>&copy; ARTS101. All rights reserved.</p>
  </footer>

</body>
</html>
