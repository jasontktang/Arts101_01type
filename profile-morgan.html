<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morgan - Manager of ARTS101</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f9f9f9; color: #333; }
    header { background: rgba(0,0,0,0.8); color: #fff; padding: 20px 40px; position: absolute; width: 100%; box-sizing: border-box; z-index: 10; }
    header h1 a { color: #fff; text-decoration: none; font-size: 24px; }
    .profile-banner { height: 350px; background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), url('Morgan_arts101_2.jpg') center/cover no-repeat; position: relative; }
    .profile-container { max-width: 800px; margin: -80px auto 40px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; text-align: center; }
    .avatar { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; margin-top: -100px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    h2 { margin: 15px 0 5px; font-size: 28px; }
    .role { color: #777; font-weight: 600; font-size: 16px; margin-bottom: 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
    .gallery-grid img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <header><h1><a href="index.html">ARTS101</a></h1></header>
  <div class="profile-banner"></div>
  <div class="profile-container">
    <img src="Morgan_profile.jpg" alt="Morgan" class="avatar">
    <h2>Morgan</h2>
    <p class="role">Manager of ARTS101</p>
    <hr style="border:0; border-top: 1px solid #eee; margin: 25px 0;">
    <h3>Artworks Gallery</h3>
    <div class="gallery-grid">
      <img src="Morgan_arts101_2.jpg" alt="Morgan Red String Painting">
      <img src="Morgan2_arts101_2.jpg" alt="Morgan Blue Floral Vase Sculpture">
      <img src="Morgan4_arts101_2.jpg" alt="Morgan Elephant Cutout Art">
      <img src="picture_red02_2.jpg" alt="Morgan Walnut Shell Study">
    </div>
  </div>
</body>
</html>
